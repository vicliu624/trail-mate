name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  geocaching:
    name: Geocaching Core and Device Session
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protocol, storage and device session
        run: |
          cmake -S modules/core_geocaching/tests -B .codex-build/geocaching-native -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/geocaching-native --parallel 2
          ctest --test-dir .codex-build/geocaching-native --output-on-failure --parallel 2

      - name: Verify device session memory safety
        run: sh modules/core_geocaching/tests/run_browse_runtime_asan.sh

  boundary:
    name: Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared/platform UI boundaries
        run: python3 scripts/check_platform_ui_boundaries.py

      - name: Verify shared SPI direct-call boundaries
        run: python3 scripts/check_shared_spi_direct_calls.py

      - name: Verify shared SPI display transaction contract
        run: python3 scripts/check_shared_spi_display_contract.py

      - name: Verify LVGL SD filesystem transaction boundary
        run: python3 scripts/check_shared_spi_lvgl_fs_boundary.py

      - name: Verify T-Deck Pro EPD transaction boundary
        run: python3 scripts/check_shared_spi_tdeck_pro_epd_boundary.py

      - name: Verify USB MSC SD transaction boundary
        run: python3 scripts/check_shared_spi_usb_msc_boundary.py

      - name: Verify SD transport strategies and FAT/exFAT transfers
        run: |
          cmake -S tests/sd_transport -B .codex-build/sd-transport -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/sd-transport --parallel 2
          ctest --test-dir .codex-build/sd-transport --output-on-failure
          python3 tests/sd_transport/test_build_configuration.py

      - name: Verify bounded map request and completion delivery
        run: |
          cmake -S tests/map_tile_pipeline -B .codex-build/map-tile-pipeline -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/map-tile-pipeline --parallel 2
          ctest --test-dir .codex-build/map-tile-pipeline --output-on-failure
          python3 tests/map_tile_pipeline/test_ui_contract.py

      - name: Verify Agenda, saved waypoints and SD session isolation
        run: |
          cmake -S modules/core_agenda -B .codex-build/agenda-core -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/agenda-core --parallel 2
          ctest --test-dir .codex-build/agenda-core --output-on-failure
          cmake -S modules/core_waypoint -B .codex-build/waypoint -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/waypoint --parallel 2
          ctest --test-dir .codex-build/waypoint --output-on-failure
          cmake -S tests/sd_record_io -B .codex-build/sd-record-io -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/sd-record-io --parallel 2
          ctest --test-dir .codex-build/sd-record-io --output-on-failure

      - name: Verify Settings navigation contract
        run: python3 tests/settings_navigation/test_contract.py

      - name: Verify shared storage retry ownership and fairness
        run: python3 platform/esp/common/tests/run_storage_adapter_retry.py

      - name: Verify ESP stack hygiene
        run: python3 scripts/check_esp_stack_hygiene.py

      - name: Verify firmware version selection
        run: python3 tests/test_firmware_version.py

      - name: Verify OTA partition size validation
        run: python3 tests/test_ota_slot_size.py

      - name: Verify Wi-Fi access policy
        run: python3 scripts/check_wifi_access_policy.py

      - name: Verify Reticulum runtime budget policy
        run: python3 scripts/check_reticulum_runtime_budget_policy.py

      - name: Verify track file streaming
        run: python3 scripts/check_track_file_streaming.py

      - name: Verify repository root has no build artifacts
        run: python3 scripts/check_root_build_artifacts.py

      - name: Verify locale packs
        run: python3 tools/validate_locale_packs.py --pack-root packs

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Verify formatting
        run: |
          clang-format-14 --version
          git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' ':(exclude)modules/core_chat/generated/**' \
            ':(exclude)modules/ui_shared/include/ui/assets/**' \
            ':(exclude)modules/ui_shared/src/ui/assets/**' \
            ':(exclude)modules/ui_shared/src/ui/tdeck_pro/font/**' \
            ':(exclude)modules/ui_shared/src/ui/widgets/text_candidate_builtin_emoji_data.h' \
            ':(exclude)platform/nrf52/arduino_common/include/ui/fonts/**' \
            ':(exclude)platform/nrf52/arduino_common/src/ui/fonts/**' \
            ':(exclude)third_party/**' \
            | xargs -0 clang-format-14 --dry-run --Werror

  build:
    name: PlatformIO Build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: tlora_pager_sx1262
            project_dir: .
            build_root: .pio/build
          - env: tlora_pager_lr1121
            project_dir: .
            build_root: .pio/build
          - env: tdeck
            project_dir: .
            build_root: .pio/build
          - env: wio_tracker_l2
            project_dir: .
            build_root: .pio/build
          - env: lilygo_twatch_s3
            project_dir: .
            build_root: .pio/build
          - env: gat562_mesh_evb_pro
            project_dir: .
            build_root: .pio/build
          - env: t-echo-lite
            project_dir: builds/pio_nrf52
            build_root: builds/pio_nrf52/.pio/build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(iconv -f UTF-16LE -t UTF-8 CHANGELOG.md | awk -F'[][]' '/^## \[[0-9]/ {print $2; exit}')
          fi
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'builds/pio_nrf52/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build (${{ matrix.env }})
        run: pio run -d ${{ matrix.project_dir }} -e ${{ matrix.env }}

      - name: Validate OTA slot size
        if: matrix.env != 'gat562_mesh_evb_pro' && matrix.env != 't-echo-lite'
        run: |
          BUILD_DIR="${{ matrix.build_root }}/${{ matrix.env }}"
          if [ -f "${BUILD_DIR}/firmware.bin" ]; then
            python scripts/check_ota_slot_size.py \
              --firmware "${BUILD_DIR}/firmware.bin" \
              --partitions "${BUILD_DIR}/partitions.bin"
          fi

      - name: Verify compact touch editor with LVGL
        if: matrix.env == 'wio_tracker_l2'
        run: |
          cmake -S modules/ui_lvgl_ux_packs/tests/touch_editor -B .codex-build/wio-touch \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLVGL_SOURCE_DIR="$PWD/.pio/libdeps/wio_tracker_l2/lvgl"
          cmake --build .codex-build/wio-touch --parallel 2
          ctest --test-dir .codex-build/wio-touch --output-on-failure

      - name: Verify Agenda layouts, reminders and input with LVGL
        if: matrix.env == 'wio_tracker_l2'
        run: |
          cmake -S modules/ui_shared/tests/agenda -B .codex-build/agenda-ui \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLVGL_SOURCE_DIR="$PWD/.pio/libdeps/wio_tracker_l2/lvgl"
          cmake --build .codex-build/agenda-ui --parallel 2
          ctest --test-dir .codex-build/agenda-ui --output-on-failure

      - name: Verify map gestures and settings navigation with LVGL
        if: matrix.env == 'wio_tracker_l2'
        run: |
          cmake -S tests/map_gesture -B .codex-build/map-gesture \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLVGL_DIR="$PWD/.pio/libdeps/wio_tracker_l2/lvgl"
          cmake --build .codex-build/map-gesture --parallel 2
          ctest --test-dir .codex-build/map-gesture --output-on-failure

      - name: Prepare and verify nRF52840 UF2
        if: matrix.env == 'gat562_mesh_evb_pro' || matrix.env == 't-echo-lite'
        run: |
          python scripts/prepare_nrf52_uf2.py \
            --env ${{ matrix.env }} \
            --build-root ${{ matrix.build_root }}

      - name: Collect firmware
        run: |
          mkdir -p dist
          BUILD_DIR="${{ matrix.build_root }}/${{ matrix.env }}"
          copied=0
          for ext in bin hex uf2 zip; do
            if [ -f "${BUILD_DIR}/firmware.${ext}" ]; then
              cp "${BUILD_DIR}/firmware.${ext}" "dist/trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}.${ext}"
              copied=$((copied + 1))
            fi
          done
          if [ "${copied}" -eq 0 ]; then
            echo "No firmware artifacts found in ${BUILD_DIR}" >&2
            exit 1
          fi

      - name: Prepare web flasher image
        if: matrix.env == 'tlora_pager_sx1262' || matrix.env == 'tlora_pager_lr1121' || matrix.env == 'tdeck' || matrix.env == 'lilygo_twatch_s3' || matrix.env == 'wio_tracker_l2'
        run: |
          python scripts/prepare_webflash_release.py \
            --env ${{ matrix.env }} \
            --build-root ${{ matrix.build_root }} \
            --dist dist \
            --boot-app0 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            --esptool ~/.platformio/packages/tool-esptoolpy/esptool.py

      - name: Collect debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          BUILD_DIR="${{ matrix.build_root }}/${{ matrix.env }}"
          SYMBOL_DIR="dist/symbols/${{ matrix.env }}"
          mkdir -p "${SYMBOL_DIR}"

          copied=0
          for name in firmware.elf firmware.map firmware.bin firmware.hex; do
            if [ -f "${BUILD_DIR}/${name}" ]; then
              cp "${BUILD_DIR}/${name}" "${SYMBOL_DIR}/${name}"
              copied=$((copied + 1))
            fi
          done

          if [ "${copied}" -eq 0 ]; then
            echo "No debug symbol inputs found for ${{ matrix.env }}"
            rm -rf "${SYMBOL_DIR}"
            exit 0
          fi

          {
            echo "schema=trail-mate.symbols.v1"
            echo "env=${{ matrix.env }}"
            echo "version=${{ steps.version.outputs.version }}"
            echo "git_ref=${GITHUB_REF}"
            echo "git_ref_name=${GITHUB_REF_NAME}"
            echo "git_sha=${GITHUB_SHA}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${SYMBOL_DIR}/manifest.txt"

          if [ -f "${BUILD_DIR}/firmware.bin" ]; then
            if ! python ~/.platformio/packages/tool-esptoolpy/esptool.py image_info --version 2 \
              "${BUILD_DIR}/firmware.bin" > "${SYMBOL_DIR}/firmware-image-info.txt" 2> "${SYMBOL_DIR}/firmware-image-info.err"; then
              {
                echo "esptool image_info failed for ${BUILD_DIR}/firmware.bin"
                echo "The firmware image is still included; image metadata is best-effort."
                cat "${SYMBOL_DIR}/firmware-image-info.err"
              } > "${SYMBOL_DIR}/firmware-image-info.txt"
            fi
            rm -f "${SYMBOL_DIR}/firmware-image-info.err"
          fi

          (cd "${SYMBOL_DIR}" && sha256sum * > SHA256SUMS)
          (cd dist/symbols && python -m zipfile -c "../trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}-symbols.zip" "${{ matrix.env }}")
          rm -rf dist/symbols

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}
          path: dist/*

  p4_contract:
    name: T-Display P4 Product Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure P4 product contract tests
        run: |
          cmake -S apps/esp32_lvgl -B build.p4-contract -G Ninja -DBUILD_TESTING=ON

      - name: Build P4 product contract tests
        run: cmake --build build.p4-contract --parallel 2

      - name: Run P4 product contract tests
        run: ctest --test-dir build.p4-contract --output-on-failure

  build_c6:
    name: ESP-IDF C6 Companion Build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(iconv -f UTF-16LE -t UTF-8 CHANGELOG.md | awk -F'[][]' '/^## \[[0-9]/ {print $2; exit}')
          fi
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build C6 companion
        shell: bash
        run: |
          source "${IDF_PATH}/export.sh"
          idf.py -C firmware/c6_companion \
            -B "${GITHUB_WORKSPACE}/firmware/c6_companion/build.c6_companion" build

      - name: Validate C6 companion partition size
        shell: bash
        run: |
          BUILD_DIR="firmware/c6_companion/build.c6_companion"
          SIZE=$(stat -c%s "${BUILD_DIR}/trail-mate-c6-companion.bin")
          MAX_SIZE=$((0x300000))
          echo "trail-mate-c6-companion.bin size=${SIZE} max=${MAX_SIZE}"
          if [ "${SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "trail-mate-c6-companion.bin exceeds the factory partition size" >&2
            exit 1
          fi

      - name: Collect C6 companion firmware
        shell: bash
        run: |
          mkdir -p dist
          cp firmware/c6_companion/build.c6_companion/trail-mate-c6-companion.bin \
            "dist/trail-mate-c6-companion-v${{ steps.version.outputs.version }}.bin"

      - name: Upload C6 companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: trail-mate-c6-companion-v${{ steps.version.outputs.version }}
          path: dist/*

  pages_contract:
    name: Pages And Locale Pack Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify locale packs
        run: python tools/validate_locale_packs.py --pack-root packs

      - name: Generate Pages release metadata and package repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare_pages_site.py --site-root site --repo ${{ github.repository }}

  build_idf:
    name: ESP-IDF Build (${{ matrix.env }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    strategy:
      fail-fast: false
      matrix:
        env:
          - t_display_p4_tft
          - t_display_p4_amoled
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(iconv -f UTF-16LE -t UTF-8 CHANGELOG.md | awk -F'[][]' '/^## \[[0-9]/ {print $2; exit}')
          fi
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.env }})
        shell: bash
        run: |
          source "${IDF_PATH}/export.sh"
          idf.py -B "${GITHUB_WORKSPACE}/build.${{ matrix.env }}" \
            -D "TRAIL_MATE_IDF_TARGET=${{ matrix.env }}" build

      - name: Validate OTA slot size
        shell: bash
        run: |
          BUILD_DIR="build.${{ matrix.env }}"
          SIZE=$(stat -c%s "${BUILD_DIR}/trail-mate.bin")
          MAX_SIZE=$((0x400000))
          echo "trail-mate.bin size=${SIZE} max=${MAX_SIZE}"
          if [ "${SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "trail-mate.bin exceeds OTA slot size" >&2
            exit 1
          fi

      - name: Collect firmware and web flasher image
        shell: bash
        run: |
          mkdir -p dist
          BUILD_DIR="build.${{ matrix.env }}"
          cp "${BUILD_DIR}/trail-mate.bin" \
            "dist/trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}.bin"
          /opt/esp/python_env/idf5.5_py3.12_env/bin/python scripts/prepare_webflash_release.py \
            --env "${{ matrix.env }}" \
            --build-root . \
            --dist dist

      - name: Collect debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          BUILD_DIR="build.${{ matrix.env }}"
          SYMBOL_DIR="dist/symbols/${{ matrix.env }}"
          mkdir -p "${SYMBOL_DIR}"
          cp "${BUILD_DIR}/trail-mate.elf" "${SYMBOL_DIR}/trail-mate.elf"
          cp "${BUILD_DIR}/trail-mate.map" "${SYMBOL_DIR}/trail-mate.map"
          cp "${BUILD_DIR}/trail-mate.bin" "${SYMBOL_DIR}/trail-mate.bin"
          {
            echo "schema=trail-mate.symbols.v1"
            echo "env=${{ matrix.env }}"
            echo "version=${{ steps.version.outputs.version }}"
            echo "git_ref=${GITHUB_REF}"
            echo "git_ref_name=${GITHUB_REF_NAME}"
            echo "git_sha=${GITHUB_SHA}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${SYMBOL_DIR}/manifest.txt"
          (cd "${SYMBOL_DIR}" && sha256sum * > SHA256SUMS)
          (cd dist/symbols && python -m zipfile -c \
            "../trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}-symbols.zip" \
            "${{ matrix.env }}")
          rm -rf dist/symbols

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}
          path: dist/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - boundary
      - format
      - build
      - p4_contract
      - build_c6
      - pages_contract
      - build_idf
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify collected firmware files
        run: |
          find dist -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' -o -name '*.zip' \) -print | sort

      - name: Extract changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          iconv -f UTF-16LE -t UTF-8 CHANGELOG.md > CHANGELOG.utf8.md
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {capture=1}
            capture {
              if ($0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]") exit
              print
            }
          ' CHANGELOG.utf8.md > release_changelog.md

          if [ ! -s release_changelog.md ]; then
            echo "Failed to extract changelog entry for version ${VERSION}" >&2
            exit 1
          fi

          cat release_changelog.md

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_changelog.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/**/*.bin
            dist/**/*.hex
            dist/**/*.uf2
            dist/**/*.zip

      - name: Refresh Pages metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          HTTP_STATUS=$(curl -sS -o /tmp/pages-dispatch-response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/pages.yml/dispatches" \
            -d "{\"ref\":\"${DEFAULT_BRANCH}\"}")

          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "Pages workflow dispatch failed with HTTP ${HTTP_STATUS}" >&2
            cat /tmp/pages-dispatch-response.txt >&2
            exit 1
          fi
