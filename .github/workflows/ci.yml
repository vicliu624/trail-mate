name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

# Push and PR events for one branch share a queue. Keep a running validation;
# replace duplicate pending runs instead of compiling the same change twice.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  firmware_scope:
    name: Determine firmware build scope
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          build=true
          if [[ "$EVENT_NAME" == push && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 && "$GITHUB_REF" != refs/tags/* ]]; then
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/trail-mate-changed-files.txt"
            if ! grep -qEv '^(tests/|modules/[^/]+/tests/|apps/[^/]+/tests/|tools/hostlink/[^/]+\.mjs$|docs/|README\.md$|AGENTS(\.local)?\.md$)' "$RUNNER_TEMP/trail-mate-changed-files.txt"; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  hostlink_management:
    name: USB Device Management and Author Proof
    runs-on: ubuntu-latest
    env:
      TRAIL_MATE_TRACK_PYTHON: .codex-build/reticulum-directory/venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install website dependencies
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Install pinned track receipt interoperability dependencies
        run: |
          python3 -m venv .codex-build/reticulum-directory/venv
          .codex-build/reticulum-directory/venv/bin/python -m pip install -r tools/geocaching/interop-requirements.txt -r tools/geocaching/bridge-requirements.txt
      - name: Install pinned native identity crypto source without building firmware
        run: |
          python3 -m pip install platformio==6.1.19
          mkdir -p .codex-build/hostlink-codec/library-deps
          pio pkg install --global --storage-dir .codex-build/hostlink-codec/library-deps --library "rweather/Crypto@0.4.0" --skip-dependencies
          pio pkg install --global --storage-dir .codex-build/hostlink-codec/library-deps --library "nanopb/Nanopb@0.4.92" --skip-dependencies
      - name: Prepare pinned native SHA-256 source without installing an ESP SDK
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/Mbed-TLS/mbedtls/tar.gz/e185d7fd85499c8ce5ca2a54f5cf8fe7dbe3f8df --output "$RUNNER_TEMP/trail-mate-native-mbedtls.tar.gz"
          echo "052dccf3a404dce25a467c6fe044b0c858d609ace8e883b59e9dfd479fdd4528  $RUNNER_TEMP/trail-mate-native-mbedtls.tar.gz" | sha256sum --check
          mkdir -p .codex-build/hostlink-codec/mbedtls-source
          tar --extract --gzip --file "$RUNNER_TEMP/trail-mate-native-mbedtls.tar.gz" --directory .codex-build/hostlink-codec/mbedtls-source --strip-components=1
      - name: Verify packet bridge pacing and origin boundaries
        working-directory: tools/geocaching
        run: ../../.codex-build/reticulum-directory/venv/bin/python -m unittest test_packet_bridge test_packet_bridge_pacing
      - name: Verify native protocol, storage policy and cryptographic vectors
        run: |
          cmake -S tests/hostlink -B .codex-build/hostlink-codec/native -DCMAKE_BUILD_TYPE=Debug -DTRAIL_MATE_ARDUINO_CRYPTO_DIR="$PWD/.codex-build/hostlink-codec/library-deps/Crypto" -DTRAIL_MATE_MODULE_NANOPB_DIR="$PWD/.codex-build/hostlink-codec/library-deps/Nanopb" -DTRAIL_MATE_REQUIRE_RADIO_IDENTITY_TESTS=ON -DTRAIL_MATE_MBEDTLS_DIR="$PWD/.codex-build/hostlink-codec/mbedtls-source"
          cmake --build .codex-build/hostlink-codec/native --parallel 2
          test -x .codex-build/hostlink-codec/native/track_snapshot_owner
          ctest --test-dir .codex-build/hostlink-codec/native --output-on-failure
          cmake -S tests/tracker_recording -B .codex-build/tracker-recording -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/tracker-recording --parallel 2
          ctest --test-dir .codex-build/tracker-recording --output-on-failure
          node --test tests/site/author-*.test.mjs tests/site/hostlink-serial.test.mjs tests/site/management-protocol.test.mjs tests/site/config-*.test.mjs tests/site/object-transfer.test.mjs tests/site/tms-document.test.mjs tests/site/track-shared-id.test.mjs tests/site/track-recording-convert.test.mjs tests/site/track-device-snapshot.test.mjs
          python3 scripts/check_esp_stack_hygiene.py
          node scripts/audit_app_config_preferences.mjs --check
          node --test tests/site/track-snapshot-native-interop.test.mjs
          node --test tests/site/track-device-catalog.test.mjs
          node --test tests/site/track-device-snapshot-build.test.mjs
          node --test tests/site/track-device-upload.test.mjs
          node --test tests/site/track-manifest.test.mjs
          node --test tests/site/track-editor-metadata.test.mjs
          node --test tests/site/track-metadata-query.test.mjs tests/site/track-metadata-query-python.test.mjs
          node --test tests/site/track-query-continuation.test.mjs tests/site/track-shared-viewport.test.mjs tests/site/track-shared-query.test.mjs tests/site/track-region-client.test.mjs
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_metadata_query
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_replication_inventory
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_replication
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_storage_recovery
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_bulk_transfer
          node --test tests/site/track-replication-inventory.test.mjs
          node --test tests/site/track-conflict.test.mjs tests/site/track-ip-read-session.test.mjs
          node --test tests/site/track-storage-error.test.mjs
          node --test tests/site/track-version-history.test.mjs
          node --test tests/site/track-multidirectory.test.mjs
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.geocaching.test_reply_queue
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_reply_pacing
          .codex-build/reticulum-directory/venv/bin/python -m unittest discover -s tests/deployment -p test_directory_image.py
          node --test tests/site/track-network-config.test.mjs
          node --test tests/site/track-manifest-geometry.test.mjs
          node --test tests/site/track-datetime-native.test.mjs
          node --test tests/site/track-manifest-native.test.mjs
          node --test tests/site/track-upload-native.test.mjs
          node --test tests/site/track-manifest-sign-native.test.mjs
          node --test tests/site/track-device-ip-confirmation.test.mjs tests/site/track-device-sync.test.mjs tests/site/track-attachment-cleanup.test.mjs tests/site/track-hardware-session.test.mjs
          node --test tests/site/track-shared-package.test.mjs tests/site/track-package-publication.test.mjs
          node --test tests/site/package-archive.test.mjs tests/site/track-kml-archive.test.mjs tests/site/track-draft-backup.test.mjs tests/site/kml-original-labels.test.mjs tests/site/recording-original.test.mjs
          node --test tests/site/track-bulk-transfer.test.mjs
            node --test tests/site/track-transport.test.mjs tests/site/track-transfer-labels.test.mjs
          node --test tests/site/radio-identity.test.mjs tests/site/radio-identity-native-interop.test.mjs
      - name: Verify native Geocaching replication and signature admission
        working-directory: tools/geocaching
        run: ../../.codex-build/reticulum-directory/venv/bin/python -m unittest test_directory_sync test_directory_transport test_publication_receipt test_snapshot_retention test_query_release
      - name: Verify shipped global administrative catalog
        run: .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_world_regions tools.tracks.test_region_catalog tools.tracks.test_region_application
      - name: Verify native Geocaching publication and offline replica recovery
        run: |
          .codex-build/reticulum-directory/venv/bin/python tools/geocaching/test_directory_network.py acceptance --work .codex-build/hostlink-codec/geocaching-network/state
          .codex-build/reticulum-directory/venv/bin/python tools/geocaching/test_directory_replication_network.py acceptance --origin .codex-build/hostlink-codec/geocaching-network/state --work .codex-build/hostlink-codec/geocaching-network/replica
      - name: Build device page and install Chromium
        working-directory: site
        run: |
          npm run build:device
          npm run build:components
          npm run build:geocaching
            npm run build:tracks
          npx playwright install --with-deps chromium
      - name: Verify device configuration and identity in Chromium
        run: |
          mkdir -p docs/locales/zh-Hans/web-outdoor-management/assets docs/locales/zh-Hans/web-outdoor-management/images
          node tests/site/device-page.browser.mjs
          node tests/site/device-page.browser.mjs --normal-flow
          node tests/site/navigation.browser.mjs
          node tests/site/radio-identity.browser.mjs
      - name: Verify KML workspace and file maintenance in Chromium
        run: |
          node tests/site/track-kml.browser.mjs
            node tests/site/track-kml-edit.browser.mjs
            node tests/site/track-kml-style.browser.mjs
            node tests/site/track-workspace.browser.mjs
            node tests/site/track-attachments.browser.mjs
            node tests/site/track-metadata.browser.mjs
            node tests/site/track-search-metadata.browser.mjs
            node tests/site/track-shared-package.browser.mjs
            node tests/site/package-install.browser.mjs
            node tests/site/package-archive.browser.mjs
            node tests/site/track-kmz-import.browser.mjs
            node tests/site/track-draft-backup.browser.mjs
            node tests/site/kml-original.browser.mjs
            node tests/site/recording-original.browser.mjs
            node tests/site/original-format-migration.browser.mjs
            node tests/site/track-map-icons.browser.mjs
      - name: Verify existing KML display and editing features in Chromium
        run: |
          node --test tests/site/track-ground-overlays.test.mjs
            node tests/site/track-ground-overlays.browser.mjs
            node --test tests/site/track-time-filter.test.mjs tests/site/track-time-editor.test.mjs
            node tests/site/track-time-filter.browser.mjs
            node tests/site/track-time-editor.browser.mjs
            node --test tests/site/track-region-preview.test.mjs
            node tests/site/track-region-preview.browser.mjs
            node --test tests/site/track-region-editor.test.mjs
            node tests/site/track-region-editor.browser.mjs
            node --test tests/site/track-kml-crop.test.mjs
            node tests/site/track-kml-crop.browser.mjs
            node tests/site/track-overlay-editor.browser.mjs
            node --test tests/site/track-overlay-input.test.mjs
            node --test tests/site/track-style-editor-labels.test.mjs
            node tests/site/track-style-editor.browser.mjs
            node --test tests/site/kml-balloon-labels.test.mjs
            node tests/site/kml-balloon.browser.mjs
            node --test tests/site/kml-list-style-labels.test.mjs
            node tests/site/kml-list-style.browser.mjs
            node --test tests/site/kml-screen-layout.test.mjs
            node tests/site/kml-screen.browser.mjs
            node tests/site/kml-photo.browser.mjs
            node --test tests/site/track-style-map-labels.test.mjs
            node tests/site/track-style-map-editor.browser.mjs
            node --test tests/site/track-style-inline-labels.test.mjs
            node tests/site/track-style-inline-editor.browser.mjs
            node --test tests/site/track-style-identity-labels.test.mjs
            node tests/site/track-style-identity-editor.browser.mjs
            node tests/site/track-gpx.browser.mjs
            node tests/site/track-device-catalog.browser.mjs
          node tests/site/track-device-upload.browser.mjs
      - name: Verify device-authored Geocaching and trail workflows in Chromium
        run: |
          node tests/site/geocaching-maintenance.browser.mjs
          node tests/site/geocaching-save-recovery.browser.mjs
          node tests/site/geocaching-signature-recovery.browser.mjs
          node tests/site/geocaching-network-maintenance.browser.mjs
          node tests/site/geocaching-query-snapshots.browser.mjs
          node tests/site/track-ip-publication.browser.mjs
          node tests/site/track-ip-publication.browser.mjs --normal-flow
          node tests/site/track-network.browser.mjs
          node tests/site/track-ip-connection.browser.mjs
            node tests/site/track-transport.browser.mjs
            node tests/site/track-refresh-network.browser.mjs
          node tests/site/track-conflict.browser.mjs
          node tests/site/track-version-history.browser.mjs
          node tests/site/track-multidirectory.browser.mjs
      - name: Verify Reticulum directory service workflows
        run: |
          .codex-build/reticulum-directory/venv/bin/python -m unittest discover -s tests/deployment -p test_shared_directory_network.py
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_replication_network
          .codex-build/reticulum-directory/venv/bin/python -m unittest tools.tracks.test_storage_network
      - name: Verify browser device trail synchronization
        run: |
          node tests/site/track-device-sync.browser.mjs

      - name: Retain browser network failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-network-diagnostics
          path: |
            .codex-build/hostlink-codec/geocaching-network-page/page-state.json
            .codex-build/hostlink-codec/geocaching-network-page/page.png
            .codex-build/hostlink-codec/geocaching-network-page/*.log
            .codex-build/hostlink-codec/shared-directory-network/*.json
            .codex-build/hostlink-codec/shared-directory-network/*.log
          if-no-files-found: ignore
          retention-days: 7

  geocaching_web:
    name: Geocaching Live Web Map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify live map startup, discovery, protocol and regions
        working-directory: site
        run: |
          npm ci --ignore-scripts
          node --test ../tests/site/geocaching-*.test.mjs
          npm run build:geocaching

  reticulum_gateway:
    name: Reticulum Gateway and IFAC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify gateway selection, persistence and IFAC codec
        run: |
          cmake -S tests/reticulum_gateway -B .codex-build/reticulum-gateway -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/reticulum-gateway --parallel 2
          ctest --test-dir .codex-build/reticulum-gateway --output-on-failure

      - name: Verify IFAC and resource vectors against Python Reticulum
        run: |
          python3 -m venv .codex-build/rns-reference
          .codex-build/rns-reference/bin/python -m pip install rns==1.5.4
          .codex-build/rns-reference/bin/python tests/reticulum_gateway/ifac_reference.py --check
          .codex-build/rns-reference/bin/python tests/reticulum_conformance/test_resource_interop.py

  geocaching:
    name: Geocaching Core and Device Session
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify protocol, storage and device session
        run: |
          cmake -S modules/core_geocaching/tests -B .codex-build/geocaching-native -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/geocaching-native --parallel 2
          ctest --test-dir .codex-build/geocaching-native --output-on-failure --parallel 2

      - name: Verify device session memory safety
        run: sh modules/core_geocaching/tests/run_browse_runtime_asan.sh

  boundary:
    name: Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared/platform UI boundaries
        run: python3 scripts/check_platform_ui_boundaries.py

      - name: Verify shared SPI direct-call boundaries
        run: python3 scripts/check_shared_spi_direct_calls.py

      - name: Verify shared SPI display transaction contract
        run: python3 scripts/check_shared_spi_display_contract.py

      - name: Verify LVGL SD filesystem transaction boundary
        run: python3 scripts/check_shared_spi_lvgl_fs_boundary.py

      - name: Verify T-Deck Pro EPD transaction boundary
        run: python3 scripts/check_shared_spi_tdeck_pro_epd_boundary.py

      - name: Verify USB MSC SD transaction boundary
        run: python3 scripts/check_shared_spi_usb_msc_boundary.py

      - name: Verify SD transport strategies and FAT/exFAT transfers
        run: |
          cmake -S tests/sd_transport -B .codex-build/sd-transport -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/sd-transport --parallel 2
          ctest --test-dir .codex-build/sd-transport --output-on-failure
          python3 tests/sd_transport/test_build_configuration.py

      - name: Verify bounded map request and completion delivery
        run: |
          cmake -S tests/map_tile_pipeline -B .codex-build/map-tile-pipeline -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/map-tile-pipeline --parallel 2
          ctest --test-dir .codex-build/map-tile-pipeline --output-on-failure
          python3 tests/map_tile_pipeline/test_ui_contract.py

      - name: Verify Agenda, saved waypoints and SD session isolation
        run: |
          cmake -S modules/core_agenda -B .codex-build/agenda-core -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/agenda-core --parallel 2
          ctest --test-dir .codex-build/agenda-core --output-on-failure
          cmake -S modules/core_waypoint -B .codex-build/waypoint -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/waypoint --parallel 2
          ctest --test-dir .codex-build/waypoint --output-on-failure
          cmake -S tests/sd_record_io -B .codex-build/sd-record-io -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/sd-record-io --parallel 2
          ctest --test-dir .codex-build/sd-record-io --output-on-failure

      - name: Verify Settings navigation contract
        run: python3 tests/settings_navigation/test_contract.py

      - name: Verify shared storage retry ownership and fairness
        run: python3 platform/esp/common/tests/run_storage_adapter_retry.py

      - name: Verify ESP stack hygiene
        run: python3 scripts/check_esp_stack_hygiene.py

      - name: Verify firmware version selection
        run: python3 tests/test_firmware_version.py

      - name: Verify OTA partition size validation
        run: python3 tests/test_ota_slot_size.py

      - name: Verify Wi-Fi access policy
        run: python3 scripts/check_wifi_access_policy.py

      - name: Verify Reticulum runtime budget policy
        run: python3 scripts/check_reticulum_runtime_budget_policy.py

      - name: Verify track file streaming
        run: |
          python3 tests/test_track_file_streaming_guard.py
          python3 scripts/check_track_file_streaming.py

      - name: Verify repository root has no build artifacts
        run: python3 scripts/check_root_build_artifacts.py

      - name: Verify locale packs
        run: python3 tools/validate_locale_packs.py --pack-root packs

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Verify formatting
        run: |
          clang-format-14 --version
          git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' ':(exclude)modules/core_chat/generated/**' \
            ':(exclude)modules/ui_shared/include/ui/assets/**' \
            ':(exclude)modules/ui_shared/src/ui/assets/**' \
            ':(exclude)modules/ui_shared/src/ui/tdeck_pro/font/**' \
            ':(exclude)modules/ui_shared/src/ui/widgets/text_candidate_builtin_emoji_data.h' \
            ':(exclude)platform/nrf52/arduino_common/include/ui/fonts/**' \
            ':(exclude)platform/nrf52/arduino_common/src/ui/fonts/**' \
            ':(exclude)third_party/**' \
            | xargs -0 clang-format-14 --dry-run --Werror

  build:
    needs: firmware_scope
    if: needs.firmware_scope.outputs.build == 'true'
    name: PlatformIO Build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: tlora_pager_sx1262
            project_dir: .
            build_root: .pio/build
          - env: tlora_pager_lr1121
            project_dir: .
            build_root: .pio/build
          - env: tdeck
            project_dir: .
            build_root: .pio/build
          - env: wio_tracker_l2
            project_dir: .
            build_root: .pio/build
          - env: lilygo_twatch_s3
            project_dir: .
            build_root: .pio/build
          - env: gat562_mesh_evb_pro
            project_dir: .
            build_root: .pio/build
          - env: t-echo-lite
            project_dir: builds/pio_nrf52
            build_root: builds/pio_nrf52/.pio/build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 scripts/read_changelog.py --version)
          fi
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'builds/pio_nrf52/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio pyelftools

      - name: Build (${{ matrix.env }})
        run: pio run -d ${{ matrix.project_dir }} -e ${{ matrix.env }}

      - name: Report linked RAM allocation
        run: |
          python scripts/report_elf_ram.py "${{ matrix.build_root }}/${{ matrix.env }}/firmware.elf" \
            --revision "${GITHUB_SHA}" --output "ram-report/${{ matrix.env }}.json"

      - name: Retain RAM allocation report
        uses: actions/upload-artifact@v4
        with:
          name: ram-report-${{ matrix.env }}
          path: ram-report/
          retention-days: 7

      - name: Validate OTA slot size
        if: matrix.env != 'gat562_mesh_evb_pro' && matrix.env != 't-echo-lite'
        run: |
          BUILD_DIR="${{ matrix.build_root }}/${{ matrix.env }}"
          if [ -f "${BUILD_DIR}/firmware.bin" ]; then
            python scripts/check_ota_slot_size.py \
              --firmware "${BUILD_DIR}/firmware.bin" \
              --partitions "${BUILD_DIR}/partitions.bin"
          fi

      - name: Verify compact touch editor with LVGL
        if: matrix.env == 'wio_tracker_l2'
        run: |
          cmake -S modules/ui_lvgl_ux_packs/tests/touch_editor -B .codex-build/wio-touch \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLVGL_SOURCE_DIR="$PWD/.pio/libdeps/wio_tracker_l2/lvgl"
          cmake --build .codex-build/wio-touch --parallel 2
          ctest --test-dir .codex-build/wio-touch --output-on-failure

      - name: Verify Agenda layouts, reminders and input with LVGL
        if: matrix.env == 'wio_tracker_l2'
        run: |
          cmake -S modules/ui_shared/tests/agenda -B .codex-build/agenda-ui \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLVGL_SOURCE_DIR="$PWD/.pio/libdeps/wio_tracker_l2/lvgl"
          cmake --build .codex-build/agenda-ui --parallel 2
          ctest --test-dir .codex-build/agenda-ui --output-on-failure

      - name: Verify map gestures and settings navigation with LVGL
        if: matrix.env == 'wio_tracker_l2'
        run: |
          cmake -S tests/map_gesture -B .codex-build/map-gesture \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLVGL_DIR="$PWD/.pio/libdeps/wio_tracker_l2/lvgl"
          cmake --build .codex-build/map-gesture --parallel 2
          ctest --test-dir .codex-build/map-gesture --output-on-failure

      - name: Prepare and verify nRF52840 UF2
        if: matrix.env == 'gat562_mesh_evb_pro' || matrix.env == 't-echo-lite'
        run: |
          python scripts/prepare_nrf52_uf2.py \
            --env ${{ matrix.env }} \
            --build-root ${{ matrix.build_root }}

      - name: Collect firmware
        run: |
          mkdir -p dist
          BUILD_DIR="${{ matrix.build_root }}/${{ matrix.env }}"
          copied=0
          for ext in bin hex uf2 zip; do
            if [ -f "${BUILD_DIR}/firmware.${ext}" ]; then
              cp "${BUILD_DIR}/firmware.${ext}" "dist/trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}.${ext}"
              copied=$((copied + 1))
            fi
          done
          if [ "${copied}" -eq 0 ]; then
            echo "No firmware artifacts found in ${BUILD_DIR}" >&2
            exit 1
          fi

      - name: Prepare web flasher image
        if: matrix.env == 'tlora_pager_sx1262' || matrix.env == 'tlora_pager_lr1121' || matrix.env == 'tdeck' || matrix.env == 'lilygo_twatch_s3' || matrix.env == 'wio_tracker_l2'
        run: |
          python scripts/prepare_webflash_release.py \
            --env ${{ matrix.env }} \
            --build-root ${{ matrix.build_root }} \
            --dist dist \
            --boot-app0 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            --esptool ~/.platformio/packages/tool-esptoolpy/esptool.py

      - name: Collect debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          BUILD_DIR="${{ matrix.build_root }}/${{ matrix.env }}"
          SYMBOL_DIR="dist/symbols/${{ matrix.env }}"
          mkdir -p "${SYMBOL_DIR}"

          copied=0
          for name in firmware.elf firmware.map firmware.bin firmware.hex; do
            if [ -f "${BUILD_DIR}/${name}" ]; then
              cp "${BUILD_DIR}/${name}" "${SYMBOL_DIR}/${name}"
              copied=$((copied + 1))
            fi
          done

          if [ "${copied}" -eq 0 ]; then
            echo "No debug symbol inputs found for ${{ matrix.env }}"
            rm -rf "${SYMBOL_DIR}"
            exit 0
          fi

          {
            echo "schema=trail-mate.symbols.v1"
            echo "env=${{ matrix.env }}"
            echo "version=${{ steps.version.outputs.version }}"
            echo "git_ref=${GITHUB_REF}"
            echo "git_ref_name=${GITHUB_REF_NAME}"
            echo "git_sha=${GITHUB_SHA}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${SYMBOL_DIR}/manifest.txt"

          if [ -f "${BUILD_DIR}/firmware.bin" ]; then
            if ! python ~/.platformio/packages/tool-esptoolpy/esptool.py image_info --version 2 \
              "${BUILD_DIR}/firmware.bin" > "${SYMBOL_DIR}/firmware-image-info.txt" 2> "${SYMBOL_DIR}/firmware-image-info.err"; then
              {
                echo "esptool image_info failed for ${BUILD_DIR}/firmware.bin"
                echo "The firmware image is still included; image metadata is best-effort."
                cat "${SYMBOL_DIR}/firmware-image-info.err"
              } > "${SYMBOL_DIR}/firmware-image-info.txt"
            fi
            rm -f "${SYMBOL_DIR}/firmware-image-info.err"
          fi

          (cd "${SYMBOL_DIR}" && sha256sum * > SHA256SUMS)
          (cd dist/symbols && python -m zipfile -c "../trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}-symbols.zip" "${{ matrix.env }}")
          rm -rf dist/symbols

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}
          path: dist/*

  p4_contract:
    name: T-Display P4 Product Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify IDF application version validation
        run: python3 -m unittest discover -s tests -p test_idf_image_version.py

      - name: Configure P4 product contract tests
        run: |
          cmake -S apps/esp32_lvgl -B build.p4-contract -G Ninja -DBUILD_TESTING=ON

      - name: Build P4 product contract tests
        run: cmake --build build.p4-contract --parallel 2

      - name: Run P4 product contract tests
        run: ctest --test-dir build.p4-contract --output-on-failure

      - name: Verify P4 keyboard with the real LVGL input state machine
        run: |
          mkdir -p .codex-build/p4-keyboard-deps/lvgl
          curl --fail --location --retry 3 https://codeload.github.com/lvgl/lvgl/tar.gz/85aa60d18b3d5e5588d7b247abf90198f07c8a63 --output "$RUNNER_TEMP/p4-keyboard-lvgl.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/p4-keyboard-lvgl.tar.gz" --directory .codex-build/p4-keyboard-deps/lvgl --strip-components=1
          cmake -S tests/p4_keyboard -B .codex-build/p4-keyboard -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLVGL_DIR="$PWD/.codex-build/p4-keyboard-deps/lvgl"
          cmake --build .codex-build/p4-keyboard --parallel 2
          ctest --test-dir .codex-build/p4-keyboard --output-on-failure

      - name: Verify P4 hardware failures and recovery
        run: |
          cmake -S tests/p4_hardware -B .codex-build/p4-hardware -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/p4-hardware --parallel 2
          ctest --test-dir .codex-build/p4-hardware --output-on-failure

      - name: Verify isolated widget ownership and strict PSRAM allocation
        run: |
          cmake -S tests/menu_widgets -B .codex-build/menu-widgets -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLVGL_DIR="$PWD/.codex-build/p4-keyboard-deps/lvgl" -DLVGL_LIBRARY="$PWD/.codex-build/p4-keyboard/lvgl/lib/liblvgl.a"
          cmake --build .codex-build/menu-widgets --parallel 2
          ctest --test-dir .codex-build/menu-widgets --output-on-failure

      - name: Verify music, audio focus and device control ownership
        run: |
          cmake -S tests/music -B .codex-build/music -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLVGL_DIR="$PWD/.codex-build/p4-keyboard-deps/lvgl"
          cmake --build .codex-build/music --parallel 2
          ctest --test-dir .codex-build/music --output-on-failure

      - name: Verify demand-driven TCP and Wi-Fi memory ownership
        run: |
          cmake -S tests/ram -B .codex-build/ram-audit/native -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/ram-audit/native --parallel 2
          ctest --test-dir .codex-build/ram-audit/native --output-on-failure

  p4_rendered_ui:
    name: T-Display P4 Rendered UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Emscripten and firmware LVGL
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/p4-emsdk"
          "$RUNNER_TEMP/p4-emsdk/emsdk" install 4.0.10
          "$RUNNER_TEMP/p4-emsdk/emsdk" activate 4.0.10
          mkdir -p .codex-build/p4-preview/lvgl
          curl --fail --location --retry 3 https://codeload.github.com/lvgl/lvgl/tar.gz/85aa60d18b3d5e5588d7b247abf90198f07c8a63 --output "$RUNNER_TEMP/p4-preview-lvgl.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/p4-preview-lvgl.tar.gz" --directory .codex-build/p4-preview/lvgl --strip-components=1
      - name: Render both P4 panels and stress dashboard ownership
        run: |
          source "$RUNNER_TEMP/p4-emsdk/emsdk_env.sh"
          emcmake cmake -S tools/web_simulator -B .codex-build/p4-preview/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTRAIL_MATE_PREVIEW_P4=ON -DLVGL_SOURCE_DIR="$PWD/.codex-build/p4-preview/lvgl"
          cmake --build .codex-build/p4-preview/build --target trailmate_p4_tft trailmate_p4_amoled trailmate_pager trailmate_tdeck trailmate_wio --parallel 2
          P4_UI_ARTIFACT_DIR=.codex-build/p4-preview/artifacts node tests/site/p4-native-ui.test.mjs
          WIDGET_UI_ARTIFACT_DIR=.codex-build/p4-preview/artifacts node tests/site/menu-widgets-native.test.mjs
          node tests/site/widget-transitions-native.test.mjs
          node tests/site/compass-capability-native.test.mjs
          MUSIC_UI_ARTIFACT_DIR=.codex-build/p4-preview/artifacts node tests/site/music-native-ui.test.mjs
          node tests/site/music-widget-refresh-native.test.mjs
          WIDGET_UI_ARTIFACT_DIR=.codex-build/p4-preview/artifacts node tests/site/pager-input-native.test.mjs
          MUSIC_UI_ARTIFACT_DIR=.codex-build/p4-preview/artifacts node tests/site/music-cjk-native.test.mjs
          WIDGET_UI_ARTIFACT_DIR=.codex-build/p4-preview/artifacts node tests/site/quick-controls-native.test.mjs
          node tests/site/settings-catalog-native.test.mjs
      - name: Retain actual LVGL frames and layout coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t-display-p4-rendered-ui
          path: .codex-build/p4-preview/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  build_c6:
    needs: firmware_scope
    if: needs.firmware_scope.outputs.build == 'true'
    name: ESP-IDF C6 Companion Build
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 scripts/read_changelog.py --version)
          fi
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build C6 companion
        shell: bash
        run: |
          source "${IDF_PATH}/export.sh"
          idf.py -C firmware/c6_companion \
            -B "${GITHUB_WORKSPACE}/firmware/c6_companion/build.c6_companion" \
            -D "PROJECT_VER=${{ steps.version.outputs.version }}" build
          python scripts/check_idf_app_version.py \
            firmware/c6_companion/build.c6_companion/trail-mate-c6-companion.bin \
            --version "${{ steps.version.outputs.version }}"

      - name: Report linked RAM allocation
        shell: bash
        run: |
          source "${IDF_PATH}/export.sh"
          python scripts/report_elf_ram.py firmware/c6_companion/build.c6_companion/trail-mate-c6-companion.elf \
            --revision "${GITHUB_SHA}" --output ram-report/c6_companion.json \
            --sdkconfig firmware/c6_companion/build.c6_companion/sdkconfig.c6_companion \
            --expect-config CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4 \
            --expect-config CONFIG_ESP_WIFI_RX_BA_WIN=4 \
            --expect-config CONFIG_ESP_WIFI_NVS_ENABLED=n

      - name: Retain RAM allocation report
        uses: actions/upload-artifact@v4
        with:
          name: ram-report-c6_companion
          path: ram-report/
          retention-days: 7

      - name: Validate C6 companion partition size
        shell: bash
        run: |
          BUILD_DIR="firmware/c6_companion/build.c6_companion"
          SIZE=$(stat -c%s "${BUILD_DIR}/trail-mate-c6-companion.bin")
          MAX_SIZE=$((0x300000))
          echo "trail-mate-c6-companion.bin size=${SIZE} max=${MAX_SIZE}"
          if [ "${SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "trail-mate-c6-companion.bin exceeds the factory partition size" >&2
            exit 1
          fi

      - name: Collect C6 companion firmware
        shell: bash
        run: |
          mkdir -p dist
          cp firmware/c6_companion/build.c6_companion/trail-mate-c6-companion.bin \
            "dist/trail-mate-c6-companion-v${{ steps.version.outputs.version }}.bin"

      - name: Upload C6 companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: trail-mate-c6-companion-v${{ steps.version.outputs.version }}
          path: dist/*

  pages_contract:
    name: Pages And Locale Pack Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify locale packs
        run: |
          python tools/validate_locale_packs.py --pack-root packs
          python tests/test_prepare_pages_site.py

      - name: Generate Pages release metadata and package repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare_pages_site.py --site-root site --repo ${{ github.repository }}

  build_idf:
    needs: firmware_scope
    if: needs.firmware_scope.outputs.build == 'true'
    name: ESP-IDF Build (${{ matrix.env }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    strategy:
      fail-fast: false
      matrix:
        env:
          - t_display_p4_tft
          - t_display_p4_amoled
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 scripts/read_changelog.py --version)
          fi
          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (${{ matrix.env }})
        shell: bash
        run: |
          source "${IDF_PATH}/export.sh"
          idf.py -B "${GITHUB_WORKSPACE}/build.${{ matrix.env }}" \
            -D "TRAIL_MATE_IDF_TARGET=${{ matrix.env }}" \
            -D "PROJECT_VER=${{ steps.version.outputs.version }}" build
          python scripts/check_idf_app_version.py "build.${{ matrix.env }}/trail-mate.bin" \
            --version "${{ steps.version.outputs.version }}"

      - name: Report linked RAM allocation
        shell: bash
        run: |
          source "${IDF_PATH}/export.sh"
          python scripts/report_elf_ram.py "build.${{ matrix.env }}/trail-mate.elf" \
            --revision "${GITHUB_SHA}" --output "ram-report/${{ matrix.env }}.json" \
            --sdkconfig "build.${{ matrix.env }}/sdkconfig.${{ matrix.env }}" \
            --expect-config CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y \
            --expect-config CONFIG_LV_USE_CUSTOM_MALLOC=y

      - name: Retain RAM allocation report
        uses: actions/upload-artifact@v4
        with:
          name: ram-report-${{ matrix.env }}
          path: ram-report/
          retention-days: 7

      - name: Validate OTA slot size
        shell: bash
        run: |
          BUILD_DIR="build.${{ matrix.env }}"
          python scripts/check_ota_slot_size.py \
            --firmware "${BUILD_DIR}/trail-mate.bin" \
            --partitions "${BUILD_DIR}/partition_table/partition-table.bin"

      - name: Collect firmware and web flasher image
        shell: bash
        run: |
          mkdir -p dist
          BUILD_DIR="build.${{ matrix.env }}"
          cp "${BUILD_DIR}/trail-mate.bin" \
            "dist/trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}.bin"
          /opt/esp/python_env/idf5.5_py3.12_env/bin/python scripts/prepare_webflash_release.py \
            --env "${{ matrix.env }}" \
            --build-root . \
            --dist dist

      - name: Collect debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          BUILD_DIR="build.${{ matrix.env }}"
          SYMBOL_DIR="dist/symbols/${{ matrix.env }}"
          mkdir -p "${SYMBOL_DIR}"
          cp "${BUILD_DIR}/trail-mate.elf" "${SYMBOL_DIR}/trail-mate.elf"
          cp "${BUILD_DIR}/trail-mate.map" "${SYMBOL_DIR}/trail-mate.map"
          cp "${BUILD_DIR}/trail-mate.bin" "${SYMBOL_DIR}/trail-mate.bin"
          {
            echo "schema=trail-mate.symbols.v1"
            echo "env=${{ matrix.env }}"
            echo "version=${{ steps.version.outputs.version }}"
            echo "git_ref=${GITHUB_REF}"
            echo "git_ref_name=${GITHUB_REF_NAME}"
            echo "git_sha=${GITHUB_SHA}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${SYMBOL_DIR}/manifest.txt"
          (cd "${SYMBOL_DIR}" && sha256sum * > SHA256SUMS)
          (cd dist/symbols && python -m zipfile -c \
            "../trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}-symbols.zip" \
            "${{ matrix.env }}")
          rm -rf dist/symbols

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: trail-mate-${{ matrix.env }}-v${{ steps.version.outputs.version }}
          path: dist/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - boundary
      - format
      - geocaching_web
      - reticulum_gateway
      - geocaching
      - build
      - p4_contract
      - p4_rendered_ui
      - hostlink_management
      - build_c6
      - pages_contract
      - build_idf
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify collected firmware files
        run: |
          find dist -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' -o -name '*.zip' \) -print | sort

      - name: Extract changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/read_changelog.py > CHANGELOG.utf8.md
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {capture=1}
            capture {
              if ($0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]") exit
              print
            }
          ' CHANGELOG.utf8.md > release_changelog.md

          if [ ! -s release_changelog.md ]; then
            echo "Failed to extract changelog entry for version ${VERSION}" >&2
            exit 1
          fi

          cat release_changelog.md

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_changelog.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/**/*.bin
            dist/**/*.hex
            dist/**/*.uf2
            dist/**/*.zip

      - name: Refresh Pages metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          HTTP_STATUS=$(curl -sS -o /tmp/pages-dispatch-response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/pages.yml/dispatches" \
            -d "{\"ref\":\"${DEFAULT_BRANCH}\"}")

          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "Pages workflow dispatch failed with HTTP ${HTTP_STATUS}" >&2
            cat /tmp/pages-dispatch-response.txt >&2
            exit 1
          fi
