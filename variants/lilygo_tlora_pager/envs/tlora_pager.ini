[env:tlora_pager_sx1262]
extends = arduino_base
board = lilygo-t-lora-pager
build_unflags =
    ${arduino_base.build_unflags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<*>
    -<ui/watch_face.cpp>
    -<ui/screens/chat_watch/>
    -<input/morse_engine.cpp>
build_flags =
    ${arduino_base.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=12288
    -DCONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=185
    -D DISPLAY_DRIVER_ST7796
    -D SCREEN_WIDTH=480
    -D SCREEN_HEIGHT=222
    -D ARDUINO_T_LORA_PAGER
    -D ARDUINO_LILYGO_LORA_SX1262
    -DTRAIL_MATE_LORA_TX_POWER_MAX_DBM=22
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTRAIL_MATE_ENABLE_USB_CDC_TRANSPORT=1
    -DTRAIL_MATE_USB_HOSTLINK_AUTOSTART=1
    -DTRAIL_MATE_SDFAT_SHARED_SPI=1
    -I variants/lilygo_tlora_pager
lib_deps =
    ${arduino_base.lib_deps}
    adafruit/Adafruit TCA8418 @ 1.0.2
    adafruit/Adafruit BusIO @ 1.17.0
lib_ignore =
    ${arduino_base.lib_ignore}
    boards_tdeck
    boards_tdeck_pro
    boards_twatchs3
    boards_tab5
    boards_t_display_p4
    boards_t_echo_lite

