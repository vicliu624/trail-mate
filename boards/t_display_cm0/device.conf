# Linux desktop composition. Dimensions describe the shared P4 landscape UI.
title=Trail Mate — T-Display-CM0
ux_pack=t_display_p4_touch
runtime_mode=mesh
width=1232
height=568
# The Raspberry Pi desktop compositor rotates DSI-1 to landscape. Avoid a
# second rotation in the application. Other sessions may select 90 explicitly.
rotation=0
fullscreen=true
tmap_creation=true
# Enable when the optional physical keyboard is attached. Alt+F4 is handled
# by the window independently of this editor/input policy.
hardware_keyboard=auto

# Keyboard illumination uses the software PWM controller, not a class index.
# The vendor on state is 10 percent duty. Preserve it as the full-scale limit.
keyboard_pwm_of_node=/pwm_gpio@16
keyboard_pwm_channel=0
keyboard_pwm_period_ns=50000
keyboard_pwm_max_duty_permille=100
keyboard_pwm_export=true

# Keep automatic output power cycling disabled until physical stock-panel
# recovery has been observed. Generic Linux sessions can opt in with wayland;
# multiple outputs require screen_power_output in a user-owned profile.
screen_power=none

# LR2021 wiring belongs to this device profile. IRQ is polled over SPI.
radio_driver=lr2021
radio_spi=/dev/spidev0.0
radio_gpiochip=/dev/gpiochip0
radio_reset=7
radio_busy=24
radio_irq=-1
radio_power=-1
radio_spi_hz=1000000
radio_tcxo_voltage=3.0

# No IMU expansion is fitted to the baseline device. Optional IIO integration
# remains available through a user-owned profile when a sensor is installed.
imu_expected=false
orientation_policy=landscape_locked
imu_mount_rotation=0

# No NRF9151/GNSS expansion is fitted. Do not acquire its GPIO or send modem
# commands. See the hardware integration guide for optional expansion settings.
gps_protocol=nmea
gps_power_line=-1
